<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pacha Rock</title>
<meta property="og:title" content="Pachapaul – Pacha Rock">
<meta property="og:description" content="Die bisherigen Songs des Rock-Albums">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&display=swap">
<style>
/* Layout: poster-style header, play-all control, track list; a player docks at the bottom */
:root{
  --ink:#121110; --ink-2:#1d1b19; --line:#33302c;
  --amp:#ff5a1f; --amp-dim:#ff5a1f22; --bone:#f2ece4; --muted:#a39b91;
  --display:"Anton",Impact,"Arial Narrow",sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--bone);margin:0}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:28px 130px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.poster{border:2px solid var(--bone);padding:22px 20px 18px;position:relative;overflow:hidden;background:
  repeating-linear-gradient(-45deg,transparent 0 14px,#ffffff06 14px 15px),var(--ink-2)}
.poster .artist{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--amp);font-weight:600}
.poster h1{font-family:var(--display);font-weight:400;font-size:clamp(64px,19vw,112px);line-height:.88;margin:6px 0 0;letter-spacing:.01em;text-transform:uppercase}
.poster h1 span{color:var(--amp)}
.poster .sub{margin-top:12px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.badge{position:absolute;top:14px;right:-34px;transform:rotate(35deg);background:var(--amp);color:var(--ink);font-weight:600;font-size:11px;letter-spacing:.15em;padding:4px 40px;text-transform:uppercase}
button{font:inherit;cursor:pointer}
.play-all{align-self:flex-start;background:var(--amp);color:var(--ink);border:0;padding:13px 26px;font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.play-all:focus-visible,.track:focus-visible,.ctrl:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
ol{list-style:none;margin:0;padding:0;border-top:2px solid var(--bone)}
.track{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.track:hover{background:var(--ink-2)}
.no{font-family:var(--display);font-size:24px;color:var(--muted);text-align:right;line-height:1}
.name{font-size:17px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.note{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.dur{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.track[aria-current="true"] .name,.track[aria-current="true"] .no{color:var(--amp)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--ink-2);border-top:2px solid var(--amp);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px}
.now{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ctrl{background:none;border:1px solid var(--line);color:var(--bone);width:42px;height:42px;display:grid;place-items:center;font-size:16px}
.ctrl.main{background:var(--amp);color:var(--ink);border-color:var(--amp)}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--amp);min-width:0}
footer{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="poster">
    <div class="badge">Demo</div>
    <div class="artist">Pachapaul</div>
    <h1>Pacha<br><span>Rock</span></h1>
    <div class="sub" id="meta">13 Songs</div>
  </header>
  <button class="play-all" id="playAll" type="button">▶ Alles abspielen</button>
  <ol id="list"></ol>
  <footer>Pachapaul · Pacha Rock · Zwischenstand, noch nicht veröffentlicht</footer>
</div>
<div class="dock" id="dock" hidden>
  <div class="dock-in">
    <div class="row">
      <button class="ctrl" id="prev" type="button" aria-label="Vorheriger Song">⏮</button>
      <button class="ctrl main" id="toggle" type="button" aria-label="Pause">❚❚</button>
      <button class="ctrl" id="next" type="button" aria-label="Nächster Song">⏭</button>
      <div class="now" id="now"></div>
    </div>
    <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Position"><span id="tot">0:00</span></div>
  </div>
</div>
<audio id="audio" preload="none"></audio>
<script>
const T=[["Loud Enough",188,"Funk-Rock, gegen rechts","12"],["Quick Win",174,"über Strategieberatungen","14"],["Born Here Too",198,"Garage-Rock, Frauenstimme","09"],["What It's All For",169,"hart und schnell","11"],["Nothing To Complain",216,"Hannover-Song, Duett","10"],["Same Old Lie",168,"Hardrock","01"],["Louder Than You",168,"Hardrock","02"],["My Street",204,"Ballade","04"],["Not Here, Not Now, Not Ever",138,"","05"],["Tomorrow's Still Ours",192,"Funk-Rock","06"],["Isar Fever",206,"","08"],["Into The Storm",181,"steigert sich vom Flüstern zum Sturm","13"],["Machine Rhapsody",198,"Rock-Oper in fünf Akten","15"]];
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const $=id=>document.getElementById(id), audio=$("audio"), list=$("list"); let idx=-1;
const total=T.reduce((a,t)=>a+t[1],0); $("meta").textContent=`${T.length} Songs · ${Math.floor(total/60)} Min. · Stand ${new Date(2026,9,13).toLocaleDateString("de-DE")}`;
T.forEach(([n,d,note],i)=>{const li=document.createElement("li");const b=document.createElement("button");b.type="button";b.className="track";
 b.innerHTML=`<span class="no">${String(i+1).padStart(2,"0")}</span><span class="name"></span><span class="dur">${fmt(d)}</span>`;
 b.querySelector(".name").textContent=n; if(note){const s=document.createElement("span");s.className="note";s.textContent=note;b.querySelector(".name").appendChild(s)}
 b.onclick=()=>{if(i===idx){audio.paused?audio.play():audio.pause()}else play(i)}; li.appendChild(b); list.appendChild(li)});
function play(i){if(i<0||i>=T.length)return; idx=i; audio.src="tracks/"+T[i][3]+".mp3"; audio.play().catch(()=>{});
 document.querySelectorAll(".track").forEach((el,j)=>el.setAttribute("aria-current",j===i?"true":"false"));
 $("now").textContent=String(i+1).padStart(2,"0")+" · "+T[i][0]; $("tot").textContent=fmt(T[i][1]); $("dock").hidden=false;
 if("mediaSession" in navigator) navigator.mediaSession.metadata=new MediaMetadata({title:T[i][0],artist:"Pachapaul",album:"Pacha Rock"});}
$("playAll").onclick=()=>play(0);
$("prev").onclick=()=>play(audio.currentTime>3?idx:Math.max(0,idx-1));
$("next").onclick=()=>{if(idx<T.length-1)play(idx+1)};
$("toggle").onclick=()=>audio.paused?audio.play():audio.pause();
audio.addEventListener("play",()=>{$("toggle").textContent="❚❚"});
audio.addEventListener("pause",()=>{$("toggle").textContent="▶"});
audio.addEventListener("ended",()=>{if(idx<T.length-1)play(idx+1)});
audio.addEventListener("timeupdate",()=>{const d=audio.duration||T[idx][1];$("cur").textContent=fmt(audio.currentTime);$("seek").value=d?audio.currentTime/d*100:0});
$("seek").addEventListener("input",e=>{const d=audio.duration||T[idx][1];audio.currentTime=e.target.value/100*d});
if("mediaSession" in navigator){navigator.mediaSession.setActionHandler("nexttrack",()=>{if(idx<T.length-1)play(idx+1)});navigator.mediaSession.setActionHandler("previoustrack",()=>play(Math.max(0,idx-1)))}
</script>
</body>
</html>
